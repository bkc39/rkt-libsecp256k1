name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  racket:
    # What the package catalog's build server does, plus the cast differential.
    name: Racket ${{ matrix.racket-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 8.8 is the floor declared in info.rkt.
        racket-version: ["8.8", "stable"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            racket-version: current
            experimental: true
          # The native build differs on macOS (clang, dylib).
          - os: macos-latest
            racket-version: stable
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: ${{ matrix.racket-version }}
      - uses: foundry-rs/foundry-toolchain@v1.9.1
      # A full setup, as for users: the pre-installer compiles the bundled C library.
      - name: Install libsecp256k1
        run: raco pkg install --batch --auto --link --name libsecp256k1 "$GITHUB_WORKSPACE"
      - name: The bundled library is the one loaded
        run: >-
          racket -l racket/base -l libsecp256k1
          -e "(unless (eq? (libsecp256k1-origin) 'bundled) (exit 1))"
      - name: Check dependencies (with docs)
        run: raco setup --check-pkg-deps --unused-pkg-deps --pkgs libsecp256k1
      - name: Test
        run: raco test -x --timeout 120 -p libsecp256k1

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Hermetic build and tests (bundled and system library)
        run: nix build -L
