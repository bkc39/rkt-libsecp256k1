name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build libsecp256k1 (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            lib: libsecp256k1.so
          - os: macos-latest
            platform: darwin
            lib: libsecp256k1.dylib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the candidate from the pinned release
        run: scripts/build-so.sh ${{ matrix.platform }}
      - name: The committed build inputs are the current ones
        working-directory: native-libs/candidates
        run: git diff --exit-code -- BUILD-INPUTS
      - name: The fresh build is the committed candidate (linux)
        if: matrix.platform == 'linux'
        working-directory: native-libs/candidates
        run: |
          set -euo pipefail
          grep ' linux/libsecp256k1.so$' SHA256SUMS | sha256sum -c -
          git diff --exit-code --stat -- linux/
      - name: Warn when the fresh build differs from the committed candidate (darwin)
        if: matrix.platform == 'darwin'
        working-directory: native-libs/candidates
        run: |
          set -euo pipefail
          committed="$(awk '$2 == "darwin/libsecp256k1.dylib" {print $1}' SHA256SUMS)"
          fresh="$(shasum -a 256 darwin/libsecp256k1.dylib | cut -d' ' -f1)"
          echo "committed: $committed"
          echo "fresh:     $fresh"
          if [ "$fresh" != "$committed" ]; then
            echo "::warning title=darwin build differs from the committed candidate::fresh" \
              "$fresh, committed $committed; the macOS lane tests the committed one"
          fi
      - name: Needs glibc 2.17 or older and nothing but libc (linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          lib=native-libs/candidates/linux/libsecp256k1.so
          objdump -T "$lib" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V -u
          newer=$(objdump -T "$lib" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V -u \
                  | awk -F_ '{split($2,v,"."); if (v[1]>2 || (v[1]==2 && v[2]>17)) print}')
          if [ -n "$newer" ]; then
            echo "error: $lib needs glibc newer than 2.17: $newer" >&2
            exit 1
          fi
          needed=$(objdump -p "$lib" | awk '/NEEDED/ {print $2}')
          echo "NEEDED: $needed"
          if [ "$needed" != "libc.so.6" ]; then
            echo "error: $lib needs more than libc.so.6" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: libsecp256k1-${{ matrix.platform }}
          path: native-libs/candidates/${{ matrix.platform }}/${{ matrix.lib }}
          if-no-files-found: error

  old-glibc:
    name: Load the linux candidate under glibc 2.17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: dlopen it in manylinux2014 and resolve secp256k1_ecdsa_recover
        run: |
          set -euo pipefail
          . native/toolchain.sh
          docker run --rm -v "$PWD/native-libs/candidates/linux:/cand:ro" \
            "$MANYLINUX_IMAGE@$MANYLINUX_DIGEST" bash -ec '
            echo "glibc: $(ldd --version | head -1)"
            cat > /tmp/probe.c <<EOF
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            void *h = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
            if (!h) { fprintf(stderr, "dlopen failed: %s\n", dlerror()); return 1; }
            if (!dlsym(h, "secp256k1_ecdsa_recover")) {
              fprintf(stderr, "dlsym failed: %s\n", dlerror());
              return 1;
            }
            printf("loaded %s and resolved secp256k1_ecdsa_recover\n", argv[1]);
            return 0;
          }
          EOF
            gcc /tmp/probe.c -o /tmp/probe -ldl
            /tmp/probe /cand/libsecp256k1.so
          '

  racket:
    name: Racket ${{ matrix.racket-version }} (${{ matrix.os }})
    needs: native
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        racket-version: ["8.8", "stable"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            racket-version: current
            experimental: true
          - os: macos-latest
            racket-version: stable
            experimental: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: ${{ matrix.racket-version }}
      - uses: foundry-rs/foundry-toolchain@v1.9.1
      - name: Enable the cast differential
        run: echo "LIBSECP256K1_CAST=$(command -v cast)" >> "$GITHUB_ENV"
      - name: Install from the committed candidate, compiling nothing
        run: raco pkg install --batch --auto --copy --name libsecp256k1 "$GITHUB_WORKSPACE"
      - name: The bundled library is the one loaded
        run: >-
          racket -l racket/base -l libsecp256k1
          -e "(unless (eq? (libsecp256k1-origin) 'bundled) (exit 1))"
      - name: Enable the system-library tests with the distribution's libsecp256k1
        if: matrix.os == 'ubuntu-latest' && matrix.racket-version == 'stable'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev
          lib="$(realpath "$(dpkg -L libsecp256k1-dev | grep '/libsecp256k1\.so$')")"
          objdump -p "$lib" | grep SONAME
          echo "LIBSECP256K1_TEST_SYSTEM_LIB=$lib" >> "$GITHUB_ENV"
      - name: Check dependencies (with docs)
        run: raco setup --check-pkg-deps --unused-pkg-deps --pkgs libsecp256k1
      - name: Test
        run: raco test -x --timeout 120 -p libsecp256k1 2>&1 | tee test.log
        shell: bash -o pipefail {0}
      - name: Skipped tests
        if: always()
        run: grep '^SKIPPED' test.log || echo "none"

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Hermetic build and tests, with the system library and the cast differential
        run: nix flake check -L
